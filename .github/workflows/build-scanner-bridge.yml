name: Build Windows Scanner Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows-scanner-bridge/**"
      - ".github/workflows/build-scanner-bridge.yml"
  push:
    branches: [main]
    paths:
      - "windows-scanner-bridge/**"
      - ".github/workflows/build-scanner-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build scanner bridge
        shell: pwsh
        run: |
          msbuild windows-scanner-bridge/TejaswiniScannerBridge.csproj /m /p:Configuration=Release
          if (!(Test-Path "windows-scanner-bridge/bin/Release/TejaswiniScannerBridge.exe")) {
            throw "Scanner bridge executable was not created."
          }
      - name: Upload Windows scanner bridge
        uses: actions/upload-artifact@v4
        with:
          name: TejaswiniScannerBridge-Windows
          path: |
            windows-scanner-bridge/bin/Release/TejaswiniScannerBridge.exe
            windows-scanner-bridge/bin/Release/TejaswiniScannerBridge.pdb
          if-no-files-found: warn
          retention-days: 14
